name: peridot-boot
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hoshikv/hackios-xnu-kernel
          ref: main

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/local/share/chromium /usr/local/share/edge /usr/share/az_* \
            /usr/local/share/boost
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl clang lld nasm \
            gcc-aarch64-linux-gnu llvm python3 python3-pip python3-venv uuid-dev \
            libtinfo6 flex bison m4 autoconf automake xz-utils libxml2-dev

      - name: Theos cctools + iOS 16.5 SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/toolchain $THEOS/sdks
          curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C $THEOS/toolchain
          url=$(curl -s https://api.github.com/repos/theos/sdks/releases/latest \
            | jq -r '.assets[] | select(.name=="iPhoneOS16.5.sdk.tar.xz") | .browser_download_url')
          test -n "$url"
          curl -sL "$url" | tar -xJ -C $THEOS/sdks
          test -x $THEOS/toolchain/linux/iphone/bin/ld
          test -d $THEOS/sdks/iPhoneOS16.5.sdk/usr/include
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          mkdir -p out
          ./xnu/apply.sh
          ./xnu-deps/setup.sh
          ./tools/mk-ath11k.sh
          mkdir -p xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT
          ./tools/mk-wlfw.sh
          touch out/.kernel-start
          ./xnu-build.sh -j"$(nproc)" -k > out/kernel-build.log 2>&1 || {
            tail -100 out/kernel-build.log
            exit 1
          }
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          test -s "$K" && test "$K" -nt out/.kernel-start || {
            tail -100 out/kernel-build.log
            exit 1
          }
          stat -c 'kernel: %s bytes' "$K"

      - name: Mu-Silicium + peridot port
        run: ./uefi/apply.sh

      - name: Python environment
        run: |
          python3 -m venv venv
          venv/bin/pip install -r Mu-Silicium/pip-requirements.txt

      - name: Use system nasm for the Mu build
        run: |
          D=Mu-Silicium/Mu_Basecore/BaseTools/Bin/mu_nasm_extdep
          mkdir -p $D/Linux-x86-64
          echo 'version: 20016.1.1' > $D/extdep_state.yaml
          ln -sf /usr/bin/nasm $D/Linux-x86-64/nasm
          ln -sf /usr/bin/ndisasm $D/Linux-x86-64/ndisasm

      - name: Build UEFI
        run: |
          cd Mu-Silicium
          source ../venv/bin/activate
          python3 build_uefi.py -d peridot -r RELEASE

      - name: Build loader
        run: ./xnuloader/build.sh

      - name: Pack boot image
        run: |
          mkdir -p out
          python3 xnuloader/mkpayload.py -o out/usb-payload.bin loader.efi=xnuloader/loader.efi --usb
          FD_BASE=0xA7100000 FD_SIZE=0x300000 PAYLOAD_BASE=0xF0000000 \
          UEFI_FD=Mu-Silicium/Build/peridotPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd \
          DTB=uefi/files/Resources/DTBs/peridot.dtb UEFI_TARGET=peridot \
          python3 mkxnuimg.py -p out/usb-payload.bin -o out/peridot-boot.img

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peridot-boot
          path: |
            out/peridot-boot.img
            out/kernel-build.log
            xnuloader/loader.efi
            xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
            Mu-Silicium/Build/peridotPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
